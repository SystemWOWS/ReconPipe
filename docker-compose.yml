# ReconPipe — start the GUI like an app:
#
#   docker compose up -d
#   open http://127.0.0.1:8088
#
# First time (or after a Dockerfile change):
#   docker compose up -d --build
#
# Optional CLI scan (same image):
#   docker compose run --rm reconpipe -d example.com
#   docker compose run --rm reconpipe --rescan -d example.com
#
# Pin a published image:
#   RECONPIPE_IMAGE=ghcr.io/systemwows/reconpipe:latest docker compose up -d

x-reconpipe-common: &reconpipe-common
  image: ${RECONPIPE_IMAGE:-ghcr.io/systemwows/reconpipe:latest}
  build: .
  working_dir: /work
  volumes:
    - ./scans:/work
    - ./docker-home:/root/.reconpipe
  environment:
    RECONPIPE_HOME: /root/.reconpipe
    RECONPIPE_WORKDIR: /work
    HTTPX_BIN: /opt/pd-bin/httpx
    PYTHONUNBUFFERED: "1"
    CHAOS_KEY: ${CHAOS_KEY:-}
    PDCP_API_KEY: ${PDCP_API_KEY:-}
    SHODAN_API_KEY: ${SHODAN_API_KEY:-}
    CENSYS_API_ID: ${CENSYS_API_ID:-}
    CENSYS_API_SECRET: ${CENSYS_API_SECRET:-}
    ZOOMEYE_API_KEY: ${ZOOMEYE_API_KEY:-}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    GITLAB_TOKEN: ${GITLAB_TOKEN:-}

services:
  # Default service — `docker compose up -d` starts only this.
  gui:
    <<: *reconpipe-common
    ports:
      - "8088:8088"
    restart: unless-stopped
    environment:
      RECONPIPE_HOME: /root/.reconpipe
      RECONPIPE_WORKDIR: /work
      HTTPX_BIN: /opt/pd-bin/httpx
      RECONPIPE_GUI_HOST: "0.0.0.0"
      RECONPIPE_GUI_PORT: "8088"
      RECONPIPE_GUI_NATIVE: "0"
      RECONPIPE_GUI_SHOW: "0"
      PYTHONUNBUFFERED: "1"
      CHAOS_KEY: ${CHAOS_KEY:-}
      PDCP_API_KEY: ${PDCP_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      CENSYS_API_ID: ${CENSYS_API_ID:-}
      CENSYS_API_SECRET: ${CENSYS_API_SECRET:-}
      ZOOMEYE_API_KEY: ${ZOOMEYE_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
    command: ["gui"]

  # One-shot CLI. Not started by `up -d`.
  reconpipe:
    <<: *reconpipe-common
    profiles: ["cli"]
    stdin_open: true
    tty: true
