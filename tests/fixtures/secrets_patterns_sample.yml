patterns:
  - pattern:
      name: AWS API Key
      regex: "AKIA[0-9A-Z]{16}"
      confidence: high
  - pattern:
      name: AWS API Gateway
      regex: "[0-9a-z]+.execute-api.[0-9a-z._-]+.amazonaws.com"
      confidence: high
  - pattern:
      name: AWS AppSync GraphQL Key
      regex: "da2-[a-z0-9]{26}"
      confidence: high
  - pattern:
      name: Adafruit IO Key
      regex: "\\b(aio_[a-zA-Z0-9]{28})\\b"
      confidence: high
  - pattern:
      name: Generic Password
      regex: "password\\s*=\\s*['\\\"][^'\\\"]+['\\\"]"
      confidence: low
  - pattern:
      name: Medium Token
      regex: "medtok_[A-Za-z0-9]{20}"
      confidence: medium
