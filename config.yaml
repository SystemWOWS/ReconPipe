validators:
  google_api:
    url: https://www.googleapis.com/geolocation/v1/geolocate?key={key}
    method: POST
    json_body:
      considerIp: 'true'
    google_api_spray: true
    valid_codes:
    - 200
    invalid_codes:
    - 400
    restricted_codes:
    - 403
    restricted_body_reasons:
    - API_KEY_HTTP_REFERRER_BLOCKED
    - API_KEY_IP_ADDRESS_BLOCKED
    - API_KEY_ANDROID_APP_BLOCKED
    - API_KEY_IOS_APP_BLOCKED
    - API_KEY_API_TARGET_BLOCKED
    - accessNotConfigured
    - dailyLimitExceeded
    - userRateLimitExceeded
    - rateLimitExceeded
    notes:
      200: 'VALID: Full access to Geolocation API'
      403: 'VALID (restricted): Key exists but IP/referer/API restricted'
  google_oauth:
    url: https://oauth2.googleapis.com/tokeninfo?access_token={key}
    method: GET
    valid_codes:
    - 200
    invalid_codes:
    - 400
    - 401
    notes:
      200: 'VALID: Google OAuth access token'
  github_pat:
    url: https://api.github.com/user
    method: GET
    headers:
      Authorization: token {key}
      Accept: application/vnd.github.v3+json
    valid_codes:
    - 200
    invalid_codes:
    - 401
    notes:
      200: 'VALID: Authenticated GitHub user'
  github_fine_pat:
    url: https://api.github.com/user
    method: GET
    headers:
      Authorization: token {key}
      Accept: application/vnd.github.v3+json
    valid_codes:
    - 200
    invalid_codes:
    - 401
    notes:
      200: 'VALID: Authenticated GitHub fine-grained PAT'
  github_oauth:
    url: https://api.github.com/user
    method: GET
    headers:
      Authorization: token {key}
    valid_codes:
    - 200
    invalid_codes:
    - 401
  github_app:
    url: https://api.github.com/user
    method: GET
    headers:
      Authorization: token {key}
      Accept: application/vnd.github.v3+json
    valid_codes:
    - 200
    invalid_codes:
    - 401
    notes:
      200: 'VALID: Authenticated GitHub app token'
  gitlab_pat:
    url: https://gitlab.com/api/v4/user
    method: GET
    headers:
      Authorization: Bearer {key}
    valid_codes:
    - 200
    invalid_codes:
    - 401
    notes:
      200: 'VALID: Authenticated GitLab user'
  stripe_live:
    url: https://api.stripe.com/v1/charges?limit=1
    method: GET
    headers:
      Authorization: Bearer {key}
    valid_codes:
    - 200
    invalid_codes:
    - 401
    notes:
      200: 'VALID LIVE KEY: Active Stripe production key'
  stripe_test:
    url: https://api.stripe.com/v1/charges?limit=1
    method: GET
    headers:
      Authorization: Bearer {key}
    valid_codes:
    - 200
    invalid_codes:
    - 401
    notes:
      200: 'VALID TEST KEY: Active Stripe test key'
  stripe_restricted:
    url: https://api.stripe.com/v1/charges?limit=1
    method: GET
    headers:
      Authorization: Bearer {key}
    valid_codes:
    - 200
    invalid_codes:
    - 401
    notes:
      200: 'VALID: Active Stripe restricted key'
  openai_key:
    url: https://api.openai.com/v1/models
    method: GET
    headers:
      Authorization: Bearer {key}
    valid_codes:
    - 200
    invalid_codes:
    - 401
    notes:
      200: 'VALID: OpenAI API key authenticated'
  anthropic_key:
    url: https://api.anthropic.com/v1/models
    method: GET
    headers:
      x-api-key: '{key}'
      anthropic-version: '2023-06-01'
    valid_codes:
    - 200
    invalid_codes:
    - 401
    - 403
    notes:
      200: 'VALID: Anthropic API key authenticated'
  digitalocean_pat:
    url: https://api.digitalocean.com/v2/account
    method: GET
    headers:
      Authorization: Bearer {key}
    valid_codes:
    - 200
    invalid_codes:
    - 401
    notes:
      200: 'VALID: DigitalOcean PAT authenticated'
  npm_token:
    url: https://registry.npmjs.org/-/whoami
    method: GET
    headers:
      Authorization: Bearer {key}
    valid_codes:
    - 200
    invalid_codes:
    - 401
    notes:
      200: 'VALID: npm token authenticated'
  pypi_token:
    url: https://upload.pypi.org/legacy/
    method: POST
    auth:
    - __token__
    - '{key}'
    valid_codes:
    - 400
    invalid_codes:
    - 401
    - 403
    notes:
      200: 'VALID: PyPI token accepted by upload endpoint'
      400: 'VALID: PyPI token authenticated (empty upload rejected)'
  private_key_pem:
    skip_reason: PEM private key material — high severity, no live API check
  slack_token:
    url: https://slack.com/api/auth.test
    method: POST
    headers:
      Authorization: Bearer {key}
    valid_codes:
    - 200
    check_body: true
    body_ok_field: ok
  jwt:
    jwt_inspect: true
  sendgrid:
    url: https://api.sendgrid.com/v3/scopes
    method: GET
    headers:
      Authorization: Bearer {key}
    valid_codes:
    - 200
    invalid_codes:
    - 401
    restricted_codes:
    - 403
    notes:
      200: 'VALID: SendGrid token (scopes endpoint)'
      403: 'VALID (restricted): SendGrid key accepted but scopes forbidden'
  mailgun:
    url: https://api.mailgun.net/v3/domains
    method: GET
    auth:
    - api
    - '{key}'
    valid_codes:
    - 200
    invalid_codes:
    - 401
  mailchimp:
    url: https://{dc}.api.mailchimp.com/3.0/
    method: GET
    auth:
    - anystring
    - '{key}'
    valid_codes:
    - 200
    invalid_codes:
    - 401
    notes:
      200: 'VALID: Mailchimp API key (datacenter ping)'
  aws_access_key:
    aws_sts: true
    valid_codes:
    - 200
    invalid_codes:
    - 403
    notes:
      200: 'VALID: STS GetCallerIdentity succeeded'
  aws_secret:
    skip_reason: Paired with aws_access_key for STS GetCallerIdentity
  aws_session_token:
    skip_reason: Paired with ASIA aws_access_key for STS GetCallerIdentity
  twilio_sid:
    twilio_pair: true
  twilio_token:
    skip_reason: Paired with twilio_sid for Basic SID:Token validation
  shopify_token:
    url: https://{domain}/admin/api/2024-01/shop.json
    method: GET
    headers:
      X-Shopify-Access-Token: '{key}'
    valid_codes:
    - 200
    invalid_codes:
    - 401
    - 403
    needs_domain: true
  discord_token:
    url: https://discord.com/api/v10/users/@me
    method: GET
    headers:
      Authorization: '{key}'
    valid_codes:
    - 200
    invalid_codes:
    - 401
  telegram_bot:
    url: https://api.telegram.org/bot{key}/getMe
    method: GET
    valid_codes:
    - 200
    invalid_codes:
    - 401
  mapbox_token:
    url: https://api.mapbox.com/tokens/v2?access_token={key}
    method: GET
    valid_codes:
    - 200
    invalid_codes:
    - 401
  discord_webhook:
    url: '{key}'
    method: GET
    valid_codes:
    - 200
    invalid_codes:
    - 401
    - 404
    webhook: true
    notes:
      200: 'VALID: Discord webhook exists'
  slack_webhook:
    url: '{key}'
    method: POST
    json_body: {}
    slack_webhook_probe: true
    webhook: true
    invalid_codes:
    - 404
    - 410
    notes:
      200: 'VALID: Slack webhook accepted probe'
  heroku_api:
    url: https://api.heroku.com/account
    method: GET
    headers:
      Accept: application/vnd.heroku+json; version=3
      Authorization: Bearer {key}
    valid_codes:
    - 200
    invalid_codes:
    - 401
    - 403
    notes:
      200: 'VALID HEROKU KEY: Full account access'
  uuid_candidate:
    skip_reason: UUID feeder only — heroku-context matches become heroku_api
  stripe_publishable:
    skip_reason: 'Informational: Stripe publishable keys are public-by-design'
  firebase_key:
    url: https://fcm.googleapis.com/fcm/send
    method: POST
    headers:
      Authorization: key={key}
      Content-Type: application/json
    json_body:
      registration_ids:
      - '1'
    valid_codes:
    - 200
    invalid_codes:
    - 401
    notes:
      200: 'VALID: legacy FCM server key (InvalidRegistration body is OK)'
  firebase_url:
    skip_reason: 'Informational: Firebase URLs are public-by-design'
  source_map_exposure:
    skip_reason: Exposure confirmed by fetch — see source_map_exposures.json
informational_types:
  stripe_publishable: Public-by-design (Stripe publishable key); not a secret
  firebase_url: Public-by-design (Firebase RTDB URL); not a secret
exposure_types:
  source_map_exposure: Public JavaScript source map (.map) — not a credential
