# Scan this repository for leaked secrets (no live internet recon).
# Drop this file at .github/workflows/reconpipe.yml in the published repo.
name: ReconPipe

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Scan repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python reconpipe.py --ci --repo . -d local \
            --skip-code-search --skip-buckets \
            --sarif results.sarif \
            -o recon_ci
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          wait-for-processing: false
