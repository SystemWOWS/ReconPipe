# Extra high-confidence prefixes from secrets-patterns-db
# https://github.com/mazen160/secrets-patterns-db (CC-BY-SA 4.0)
# Also consumed by jsleak: https://github.com/byt3hx/jsleak
# Pull a larger filtered set: python reconpipe.py -d example.com --refresh-secrets-db
patterns:
  - pattern:
      name: AWS AppSync GraphQL Key
      regex: "da2-[a-z0-9]{26}"
      confidence: high
  - pattern:
      name: Adafruit IO Key
      regex: "\\b(aio_[a-zA-Z0-9]{28})\\b"
      confidence: high
  - pattern:
      name: Flutterwave Live Secret
      regex: "\\b(flb_live_[0-9a-zA-Z]{20})\\b"
      confidence: high
  - pattern:
      name: RubyGems API Key
      regex: "\\b(rubygems_[a-zA-Z0-9]{48})\\b"
      confidence: high
